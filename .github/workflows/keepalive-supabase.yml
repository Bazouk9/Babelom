name: Keep Supabase awake
 
on:
  schedule:
    # Tous les 2 jours (à 06h17 UTC) : évite la mise en pause du plan gratuit
    - cron: '17 6 */2 * *'
  workflow_dispatch:   # permet aussi de le lancer à la main pour tester
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base Supabase
        env:
          SUPABASE_URL: https://qbxshawdxqochjsmoodl.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/temoignages?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
